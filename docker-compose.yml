services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis1:
    image: redis:latest
    ports:
      - "6381:6379"
    restart: always

  redis2:
    image: redis:latest
    ports:
      - "6382:6379"
    restart: always

  redis3:
    image: redis:latest
    ports:
      - "6383:6379"
    restart: always

  api1:
    build: .
    environment:
      - REDIS_ADDR=redis1:6379
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - redis1
      - kafka
    expose:
      - "8080"

  api2:
    build: .
    environment:
      - REDIS_ADDR=redis2:6379
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - redis2
      - kafka
    expose:
      - "8080"

  api3:
    build: .
    environment:
      - REDIS_ADDR=redis3:6379
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - redis3
      - kafka
    expose:
      - "8080"

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2
      - api3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
